name: Docker API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test Docker application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Prepare non-secret CI configuration
        run: cp .env.ci .env

      - name: Build and start Docker services
        run: docker compose up -d --build

      - name: Wait for FastAPI to become ready
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T backend python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"; then
              exit 0
            fi
            sleep 2
          done
          echo "FastAPI did not become ready in time."
          docker compose logs --no-color backend
          exit 1

      - name: Run API smoke tests and create JUnit report
        run: docker compose exec -T backend pytest -q --junitxml=/tmp/junit.xml

      - name: Copy JUnit report from the container
        if: always()
        run: docker compose cp backend:/tmp/junit.xml junit.xml || true

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn

      - name: Show Docker logs when a step fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop CI containers
        if: always()
        run: docker compose down